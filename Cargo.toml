[package]
name    = "pingora-edge"
version = "0.6.0"
edition = "2021"
description = "A TLS-terminating edge proxy built on Pingora and BoringSSL"
license = "MIT"
repository = "https://github.com/itzngga/pingora-edge"
readme = "README.md"
publish = false

[[bin]]
name = "pingora-edge"
path = "src/main.rs"

[features]
# BoringSSL is the default TLS backend. OpenSSL is kept as an alternative.
default   = ["boringssl"]
boringssl = ["pingora-core/boringssl", "dep:pingora-boringssl"]
openssl   = ["pingora-core/openssl", "dep:pingora-openssl"]

[dependencies]
pingora-core  = { version = "0.9", default-features = false }
pingora-proxy = "0.9"
pingora-http  = "0.9"

# TLS backends
pingora-boringssl = { version = "0.9", optional = true }
pingora-openssl   = { version = "0.9", optional = true }

# ACME
instant-acme = { version = "=0.7.2", features = ["hyper-rustls"] }
rcgen        = { version = "0.13", features = ["pem", "x509-parser"] }
rustls       = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] } # ring is the installed provider

# Lock-free swaps for certificates and config generations
arc-swap = "1.7.1"

# Config
toml       = "0.8"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Rate limiting and connection tracking
governor = "=0.6.3"
moka     = { version = "0.12", features = ["sync"] }

# Allocator
mimalloc = "0.1"

# Async
async-trait = "0.1"
tokio       = { version = "1", features = ["full"] }
# TCP keepalive on the :443 pre-filter sockets; tokio does not expose it.
socket2     = "0.6"

# HTTP clients and servers for metrics, the control socket and list fetches
hyper          = { version = "1", features = ["full"] }
hyper-util     = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
http-body-util = "0.1"
hyper-rustls   = { version = "0.27", default-features = false, features = ["native-tokio", "http1", "tls12", "logging", "ring"] } # no aws-lc-rs: main.rs installs ring

# IP range matching
ipnet   = "2"
iprange = "0.6"

# Misc
anyhow             = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
num_cpus           = "1"
chrono             = "0.4"
x509-parser        = "0.16"
once_cell          = "1"
http               = "1.4.0"
bytes  = "1.11.1"
brotli = "3.5.0"
flate2 = "1.1.9"
libc   = "0.2"
# HMAC for the signed real-IP header between chained edges.
ring   = "0.17"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
panic         = "abort"
strip         = true

[profile.dev]
# Keeps file:line in panics and backtraces without full debuginfo.
debug = "line-tables-only"
